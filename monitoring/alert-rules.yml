groups:
  - name: todo-alerts
    rules:
      - alert: ServiceDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"

      - alert: HighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 80% for 5 minutes"

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of requests are failing"

      - alert: LowDisk
        expr: |
          100 * node_filesystem_avail_bytes{mountpoint="/", fstype="ext4"}
          /
          node_filesystem_size_bytes{mountpoint="/", fstype="ext4"} < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% disk space left"